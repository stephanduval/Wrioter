version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wrioter-app
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=wrioter_prod
      - DB_USERNAME=wrioter_user
      - DB_PASSWORD=wrioter_secure_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - wrioter-network

  mysql:
    image: mysql:8.0
    container_name: wrioter-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_password
      - MYSQL_DATABASE=wrioter_prod
      - MYSQL_USER=wrioter_user
      - MYSQL_PASSWORD=wrioter_secure_password
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - wrioter-network

  redis:
    image: redis:7-alpine
    container_name: wrioter-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - wrioter-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  wrioter-network:
    driver: bridge